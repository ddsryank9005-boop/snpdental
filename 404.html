<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 — 에스앤피 치과의원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;background:#13201B url(/img/tex-deepgrad.jpg) center/cover no-repeat;color:#F5F3EC;font-family:"Noto Sans KR",system-ui,sans-serif;text-align:center;word-break:keep-all}
main{max-width:520px}
.logo{display:block;width:120px;height:auto;margin:0 auto 44px;opacity:.95}
.code{font-family:"Noto Serif KR",serif;font-size:15px;letter-spacing:.32em;color:rgba(245,243,236,.55)}
h1{font-family:"Noto Serif KR",serif;font-weight:500;font-size:clamp(26px,5vw,34px);line-height:1.45;margin:14px 0 16px}
p{font-size:16px;line-height:1.8;color:rgba(245,243,236,.75)}
.en{margin-top:6px;font-size:14px;color:rgba(245,243,236,.5)}
a.home{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 26px;margin-top:36px;border:1px solid rgba(245,243,236,.45);border-radius:999px;color:#F5F3EC;text-decoration:none;font-size:15.5px;transition:background .35s,color .35s}
a.home:hover{background:#F5F3EC;color:#1E2B26}
</style>
</head>
<body>
<main>
  <img class="logo" src="/img/logo-mark.png" alt="S&amp;P 치과의원">
  <div class="code">404</div>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 없는 페이지입니다.</p>
  <p class="en">The page you’re looking for doesn’t exist.</p>
  <a class="home" href="/">홈페이지로 돌아가기 →</a>
</main>
</body>
</html>
